<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Page</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470'); /* Mountain image */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 50px;
            text-align: center;
            margin-top: 100px;
            border-radius: 10px;
        }

        .marquee-container {
            background-color: #333;
            color: yellow;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Hello from AKS CI/CD DEMO v1</h1>
        <h2>Welcome to  Website  Sailing Between Peaks & Blue Seas</h2>
        <p>Welcome to the Mountains—where every peak connects you, and every moment breathes life into technology</p>
    </div>

    <marquee direction="left" scrollamount="10" class="marquee-container">
        *** Welcome! Enjoy your stay. New content scrolling here... ***
    </marquee>

</body>
</html>
